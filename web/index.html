<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
<!--  <base href="$FLUTTER_BASE_HREF">-->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>portfolio</title>
  <link rel="manifest" href="manifest.json">

  <script defer src="index.dart.js" type="application/javascript"></script>

  <style>
    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    .loader {
      color: #7B61FF;
      font-family: Consolas, Menlo, Monaco, monospace;
      font-weight: bold;
      font-size: 78px;
      opacity: 0.8;
    }
    
    .loader:before {
      content: "{";
      display: inline-block;
      animation: pulse 0.4s alternate infinite ease-in-out;
    }
    
    .loader:after {
      content: "}";
      display: inline-block;
      animation: pulse 0.4s 0.3s alternate infinite ease-in-out;
    }

    @keyframes pulse {
      to {
        transform: scale(0.8);
        opacity: 0.5;
      }
    }
    
    .fadeout {
      animation: fadeout 1s forwards;
    }
    
    @keyframes fadeout {
      from {
        transform: scale(1);
        opacity: 0.8;
      }
      to {
        transform: scale(1.5);
        opacity: 0;
      }
    }
  </style>

</head>
<body>
  <div id="loading_indicator" class="loader-container">
    <span class="loader"></span>
  </div>

  <script src="flutter_bootstrap.js" async></script>

   <script>
    window.onload = function() {
      setTimeout(() => {
        var loadingIndicator = document.getElementById("loading_indicator");
        if(loadingIndicator) {
          // Add fadeout class to trigger the animation
          var loader = loadingIndicator.querySelector(".loader");
          loader.classList.add("fadeout");
          
          // Remove the element after animation completes
          setTimeout(() => {
            loadingIndicator.remove();
          }, 2500);
        }
      }, 2500);
    }
  </script>
</body>
</html>
